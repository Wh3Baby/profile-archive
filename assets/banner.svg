<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="0.55" stop-color="#0E141B"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 60) rotate(45) scale(220)">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 280) rotate(-45) scale(260)">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1E293B" stroke-opacity="0.55" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glowCyan)"/>
  <rect width="1200" height="320" fill="url(#glowViolet)"/>

  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <text x="64" y="126" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="86" font-weight="700" fill="#F8FAFC">wh3baby</text>
  <text x="66" y="172" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="22" font-weight="500" fill="url(#accent)">c++ / c / javascript / assembly / reverse engineering</text>

  <g font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="15">
